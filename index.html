<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FX Flow Agent</title><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#17202a}header{background:#18212f;color:#fff;padding:18px}h1{margin:0;font-size:22px}nav{display:flex;gap:8px;padding:12px;background:#fff;overflow:auto}button{border:0;padding:10px 14px;border-radius:8px;background:#e8edf3}.active{background:#18212f;color:#fff}main{padding:18px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 5px #0001}.value{font-size:25px;font-weight:700;margin-top:8px}.small{color:#667085;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e8edf3;text-align:left}.positive{color:#087f5b}</style></head><body><header><h1>FX Flow Agent</h1><div class="small" style="color:#cbd5e1">Российский валютный баланс • Spot/TOM • без OI фьючерсов</div></header><nav id="nav"></nav><main id="app"></main><script>const pages={"Главная":()=>`<div class="grid"><div class="card"><div class="small">Оценка Net FX Flow</div><div class="value positive">+42 млрд ₽</div><div class="small">демо-значение</div></div><div class="card"><div class="small">CNY/RUB</div><div class="value">—</div><div class="small">источник не подключён</div></div></div><h2>Что анализирует агент</h2><div class="card"><table><tr><th>Фактор</th><th>Роль</th></tr><tr><td>Экспортная выручка</td><td>Ожидаемый приток валюты</td></tr><tr><td>Минфин / ЦБ</td><td>Покупки и продажи валюты</td></tr><tr><td>Нефть, газ, металлы</td><td>База оценки выручки</td></tr><tr><td>Налоговый период</td><td>Профиль продаж</td></tr><tr><td>CNY/RUB Spot/TOM</td><td>Сопоставление с рынком</td></tr></table></div>`,"Net FX Flow":()=>`<h2>Расчёт Net FX Flow</h2><div class="card"><table><tr><th>Компонент</th><th>Демо, млрд ₽</th></tr><tr><td>Экспортная выручка</td><td>+120</td></tr><tr><td>Валютные расходы</td><td>−35</td></tr><tr><td>Минфин/ЦБ: продажи</td><td>+20</td></tr><tr><td>Минфин/ЦБ: покупки</td><td>−63</td></tr><tr><th>Итого</th><th>+42</th></tr></table></div><p class="small">Числа демонстрационные.</p>`,"Источники":()=>`<h2>Источники</h2><div class="grid"><div class="card"><b>ЦБ РФ</b><p>Статистика и валютные операции</p></div><div class="card"><b>Минфин РФ</b><p>Операции по бюджетному правилу</p></div><div class="card"><b>Сырьё</b><p>Нефть, газ, металлы</p></div><div class="card"><b>Рынок</b><p>CNY/RUB Spot/TOM</p></div></div>`,"История":()=>`<h2>История расчётов</h2><div class="card">Демо-запись: +42 млрд ₽</div>`};let current="Главная";function render(){nav.innerHTML=Object.keys(pages).map(x=>`<button class="${x===current?'active':''}" onclick="current='${x}';render()">${x}</button>`).join('');app.innerHTML=pages[current]()}render();</script></body></html>
